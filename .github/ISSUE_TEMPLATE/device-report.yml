name: Device report
description: Tell us how Earshot works with your headset, any brand.
labels: [device]
body:
  - type: input
    id: model
    attributes:
      label: Headset
      placeholder: SteelSeries Arctis Nova 7P Gen 2
    validations:
      required: true
  - type: input
    id: usb-id
    attributes:
      label: USB vendor and product ID
      description: System Information, USB, your headset or its dongle.
      placeholder: "1038:2298"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.4"
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: The icon appears and shows the battery
        - label: Charging and on or off are right
        - label: Audio switching
        - label: Headset settings show the right values
        - label: Changing a setting takes effect
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: What went wrong, and the log from `log show --last 10m --predicate 'subsystem == "com.gabrielbelli.Earshot"'`.
      render: text
